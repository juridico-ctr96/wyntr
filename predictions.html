<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIME SCORE — Prediction Ledger</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1100px,92%);margin:auto;padding:22px 0}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{color:#63e8ff;font-weight:950;letter-spacing:3px;text-decoration:none}.back{color:#8d99aa;text-decoration:none;font-size:12px}.hero,.row{border:1px solid #25344a;border-radius:16px;background:#0d1522;padding:15px}.hero{background:linear-gradient(145deg,#0d1726,#090f19)}h1{margin:0;font-size:28px}.sub{color:#8290a4;font-size:12px;line-height:1.5;margin-top:7px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.kpi b{font-size:22px}.kpi span{display:block;color:#7f8da2;font-size:9px;text-transform:uppercase;margin-top:4px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls button{background:#111927;border:1px solid #293852;color:#fff;border-radius:999px;padding:9px 12px}.controls button.active{border-color:#18d7b0}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:65px 1fr 130px 90px;gap:12px;align-items:center}.sport{font-size:9px;font-weight:900;color:#18d7b0;text-transform:uppercase}.teams{font-weight:850}.date{font-size:10px;color:#718096;margin-top:4px}.prob{text-align:right;font-weight:900}.status{text-align:right;font-size:10px;font-weight:900}.correct{color:#18d7b0}.incorrect{color:#ff7788}.pending{color:#ffd166}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.row{grid-template-columns:50px 1fr 75px}.status{grid-column:2/4;text-align:left}}@media(max-width:430px){.row{grid-template-columns:1fr 70px}.sport{grid-column:1}.prob{grid-column:2;grid-row:1/3}.teams,.status{grid-column:1}.status{text-align:left}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">PRIME SCORE</a><a class="back" href="/">← Inicio</a></div><section class="hero"><h1>Prediction Ledger</h1><div class="sub">Registro público de las predicciones publicadas por Prime Score. Los resultados se incorporan automáticamente cuando la fuente deportiva los confirma.</div><div id="kpis" class="kpis"></div></section><div class="controls"><button class="active" data-sport="">Todos</button><button data-sport="nba">NBA</button><button data-sport="tennis">Tenis</button><button data-status="pending">Pendientes</button><button data-status="correct">Correctas</button><button data-status="incorrect">Incorrectas</button></div><div id="list" class="list"><div class="row">Cargando…</div></div></main><script>
let sport="",status="";
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const date=x=>{const d=new Date(x);return Number.isFinite(d.getTime())?d.toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—"};
async function load(){const q=new URLSearchParams({limit:"100"});if(sport)q.set("sport",sport);if(status)q.set("status",status);const r=await fetch("/api/predictions?"+q),j=await r.json();if(!r.ok)throw Error(j.error||"Error");const a=j.items||[],s=a.filter(x=>x.status!=="pending"),c=a.filter(x=>x.status==="correct").length;document.getElementById("kpis").innerHTML=[["Publicadas",a.length],["Pendientes",a.filter(x=>x.status==="pending").length],["Resueltas",s.length],["Acierto simple",s.length?(c/s.length*100).toFixed(1)+"%":"—"]].map(x=>'<div class="row kpi"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("");document.getElementById("list").innerHTML=a.length?a.map(x=>'<article class="row"><div class="sport">'+esc(x.sport)+'</div><div><div class="teams">'+esc(x.home_name)+' vs '+esc(x.away_name)+'</div><div class="date">'+date(x.scheduled_at)+' · '+esc(x.model_version)+'</div></div><div class="prob">'+Number(x.home_probability).toFixed(1)+'% / '+Number(x.away_probability).toFixed(1)+'%</div><div class="status '+x.status+'">'+x.status.toUpperCase()+'</div></article>').join(""):'<div class="row">No hay predicciones publicadas.</div>'}
document.querySelectorAll(".controls button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("active"));b.classList.add("active");sport=b.dataset.sport||"";status=b.dataset.status||"";load()});
load().catch(e=>document.getElementById("list").innerHTML='<div class="row">'+esc(e.message)+'</div>');
</script></body></html>
