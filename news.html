<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prime News Intelligence</title>
<style>
:root{--bg:#050914;--card:#0b1220;--line:#1b2a3e;--text:#f4f7fb;--muted:#8fa0b7;--accent:#63e8ff;--green:#8ef0bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#13243b 0,#050914 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{width:min(1100px,100%);margin:auto;padding:18px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:950;letter-spacing:.12em;font-size:12px;color:var(--accent)}.back{color:var(--text);text-decoration:none;border:1px solid var(--line);background:#0a111d;padding:10px 13px;border-radius:12px;font-weight:800}
h1{font-size:clamp(28px,6vw,48px);margin:8px 0}.sub{color:var(--muted);margin:0 0 24px}.status{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:800;margin-bottom:16px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:block;color:inherit;text-decoration:none;background:linear-gradient(180deg,#0c1524,#09101b);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#31506e}.img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#101a29}.body{padding:14px}.tag{color:var(--accent);font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}.title{font-size:15px;font-weight:850;line-height:1.3;margin:7px 0 10px}.meta{font-size:11px;color:var(--muted)}.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding-top:14px}.card{display:grid;grid-template-columns:125px 1fr}.img{height:100%;aspect-ratio:auto}.body{padding:12px}.title{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">PRIME SCORE · NEWS INTELLIGENCE</div><a class="back" href="/">← Prime Score</a></header>
<h1>Prime News Intelligence</h1>
<p class="sub">Noticias NBA seleccionadas y contextualizadas para seguir equipos, jugadores y partidos.</p>
<div class="status"><span class="dot"></span><span id="status">Actualizando noticias…</span></div>
<section id="news" class="grid"><div class="empty">Cargando noticias…</div></section>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const time=d=>{if(!d)return "";const x=new Date(d);return isNaN(x)?"":x.toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});};
async function load(){const box=document.querySelector("#news"),status=document.querySelector("#status");try{const r=await fetch("/api/nba-news",{cache:"no-store"});if(!r.ok)throw new Error("news");const data=await r.json();const items=Array.isArray(data.items)?data.items:[];if(!items.length){box.innerHTML='<div class="empty">No hay noticias disponibles en este momento.</div>';status.textContent="Sin noticias disponibles";return;}box.innerHTML=items.map(i=>'<a class="card" href="'+esc(i.url||"#")+'" target="_blank" rel="noopener noreferrer">'+(i.image?'<img class="img" src="'+esc(i.image)+'" alt="" loading="lazy">':'<div class="img"></div>')+'<div class="body"><div class="tag">Última hora · '+esc(i.source||"NBA")+'</div><div class="title">'+esc(i.title)+'</div><div class="meta">'+time(i.publishedAt||i.date)+'</div></div></a>').join("");status.textContent=items.length+" noticias · actualizado ahora";}catch(e){box.innerHTML='<div class="empty">No pudimos cargar las noticias. Intenta de nuevo.</div>';status.textContent="Sin conexión";}}
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
