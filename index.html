<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYNTR — FIND THE SIGNAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08090c;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 7%;
      border-bottom: 1px solid #202229;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .tagline {
      color: #858b98;
      font-size: 12px;
      letter-spacing: 2px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 55px 7%;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 80px);
      line-height: .95;
      margin: 0 0 20px;
      letter-spacing: -4px;
    }

    .hero p {
      color: #9298a5;
      max-width: 620px;
      font-size: 18px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 35px 0;
    }

    select, button {
      background: #12151b;
      color: white;
      border: 1px solid #2b303a;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: white;
      color: #08090c;
      font-weight: 700;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-top: 35px;
    }

    .card {
      background: #101217;
      border: 1px solid #242832;
      border-radius: 16px;
      padding: 22px;
    }

    .card span {
      color: #7e8592;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card strong {
      display: block;
      font-size: 30px;
      margin-top: 10px;
    }

    .signal {
      margin-top: 35px;
      padding: 28px;
      border: 1px solid #303641;
      border-radius: 18px;
      background: linear-gradient(135deg, #11141a, #0b0d11);
    }

    .signal h2 {
      margin-top: 0;
    }

    .signal p {
      color: #9ca3af;
      line-height: 1.6;
    }

    .modules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 35px;
    }

    .module {
      padding: 20px;
      border-radius: 12px;
      background: #0e1015;
      border: 1px solid #222630;
      text-align: center;
      color: #cbd0d9;
    }

    .status {
      margin-top: 14px;
      color: #737b88;
      font-size: 12px;
      line-height: 1.5;
    }

    .games {
      margin-top: 24px;
      display: none;
    }

    .games label {
      display: block;
      color: #858b98;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .games select {
      width: 100%;
    }

    footer {
      padding: 40px 7%;
      color: #656b76;
      text-align: center;
      border-top: 1px solid #202229;
      font-size: 12px;
    }

    .source {
      color: #666e7b;
      font-size: 11px;
      margin-top: 10px;
    }
  </style>
